name: GitHub stats
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          user: H3xKatana
          filename: github-metrics.svg
          committer_branch: main
          config_timezone: Africa/Algiers

          # --- base card: header, activity, community, repos, gists ---
          base: header, activity, community, repositories, metadata

          # --- 3D half-year isometric commit calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # --- commit streaks come from the isocalendar block below; the
          # habits plugin errors on v3.34 ("Cannot destructure 'author'"),
          # so it stays disabled ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_isocalendar_details: yes

          # --- language activity bars with percentages ---
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 10
          plugin_languages_colors: github
